{% extends "base.html" %} {% block content %}

<h2 class="page-title">My QR Codes</h2>

{% for r in registrations %}

<div class="card">
  <h3>{{ r.event.title }}</h3>

  <p><strong>Club:</strong> {{ r.event.club.name }}</p>

  {% if r.qr_code %}
  <img src="{{ r.qr_code.url }}" width="150" />
  {% else %}
  <p>No QR generated</p>
  {% endif %}
</div>

{% empty %}

<p>No registrations yet.</p>

{% endfor %} {% endblock %}
