{% extends "base.html" %} {% block content %}

<h2 class="page-title">Attendance Report</h2>

<div class="report-grid">
  {% for r in report %}

  <div class="report-card">
    <h3>{{ r.event.title }}</h3>
    <p class="club">{{ r.club.name }}</p>

    <div class="stats">
      <div class="stat total">
        <span>{{ r.total_registered }}</span>
        <p>Total</p>
      </div>

      <div class="stat present">
        <span>{{ r.present }}</span>
        <p>Present</p>
      </div>

      <div class="stat absent">
        <span>{{ r.absent }}</span>
        <p>Absent</p>
      </div>
    </div>
  </div>

  {% empty %}
  <p>No data available.</p>
  {% endfor %}
</div>

{% endblock %}
