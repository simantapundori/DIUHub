{% extends "base.html" %} {% block content %}

<h2>👥 {{ event.title }} - Students</h2>

<table>
  <tr>
    <th>Name</th>
    <th>ID</th>
    <th>Status</th>
  </tr>

  {% for s in students %}
  <tr>
    <td>{{ s.name }}</td>
    <td>{{ s.student_id }}</td>
    <td>
      {% if s.status == "Present" %}
      <span class="status present">✔ Present</span>
      {% else %}
      <span class="status absent">✖ Absent</span>
      {% endif %}
    </td>
  </tr>
  {% endfor %}
</table>

{% endblock %}
