{% extends "base.html" %} {% block content %}

<h2 class="page-title">📷 Scan Attendance</h2>

<div class="scan-container">
  <!-- SCANNER CARD -->
  <div class="card scan-card">
    <div class="scan-header">
      <h3>QR Scanner</h3>
      <p class="subtitle">Scan student QR to mark attendance</p>
    </div>

    <!-- CAMERA -->
    <div id="reader"></div>

    <!-- RESULT -->
    <div id="scan-result" class="scan-result">Waiting for scan...</div>
  </div>
</div>

<!-- QR LIB -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
  function onScanSuccess(decodedText) {
    const resultBox = document.getElementById("scan-result");

    // ⛔ prevent rapid duplicate scans (important)
    if (window.lastScan === decodedText) return;
    window.lastScan = decodedText;

    resultBox.innerText = "Processing...";
    resultBox.className = "scan-result loading";

    fetch("/attendance/scan/", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "X-CSRFToken": "{{ csrf_token }}",
      },
      body: "qr_data=" + decodedText,
    })
      .then((res) => res.json())
      .then((data) => {
        // ✅ SUCCESS OR ALREADY → SHOW DETAILS
        if (data.status === "success" || data.status === "already") {
          resultBox.innerHTML = `
          <div class="scan-success-box">
            <h4>${data.message}</h4>
            <p><strong>Name:</strong> ${data.student_name || "N/A"}</p>
            <p><strong>ID:</strong> ${data.student_id || "N/A"}</p>
            <p><strong>Event:</strong> ${data.event || "N/A"}</p>
          </div>
        `;

          resultBox.className =
            data.status === "success"
              ? "scan-result success"
              : "scan-result warning";

          // 🔊 optional sound (nice touch)
          new Audio(
            "https://www.soundjay.com/buttons/sounds/button-3.mp3",
          ).play();
        } else {
          resultBox.innerText = data.message || "❌ Invalid QR";
          resultBox.className = "scan-result error";
        }
      })
      .catch(() => {
        resultBox.innerText = "❌ Server Error";
        resultBox.className = "scan-result error";
      });

    // ⏳ allow next scan after 2 sec
    setTimeout(() => {
      window.lastScan = null;
    }, 2000);
  }

  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras()
    .then((devices) => {
      if (devices.length) {
        // 📱 prefer back camera (mobile)
        let backCam = devices.find((cam) =>
          cam.label.toLowerCase().includes("back"),
        );

        let cameraId = backCam ? backCam.id : devices[0].id;

        html5QrCode.start(
          cameraId,
          {
            fps: 10,
            qrbox: { width: 250, height: 250 },
          },
          onScanSuccess,
        );
      }
    })
    .catch(() => {
      document.getElementById("scan-result").innerText =
        "❌ Camera not accessible";
    });
</script>

{% endblock %}
