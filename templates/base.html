{% load static %}

<!doctype html>
<html>
  <head>
    <title>DIUHub</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->

      <div class="sidebar" id="sidebar">
        <div class="logo-container">
          <img src="{% static 'images/diuhub_logo.png' %}" class="logo-img" />
        </div>

        <nav class="nav-links">
          <a href="/dashboard/" class="nav-item">🏠 Dashboard</a>

          <a href="/profile/" class="nav-item">👤 My Profile</a>

          <a href="/clubs/" class="nav-item">🏫 Clubs</a>

          <a href="/events/" class="nav-item">📅 Events</a>

          <a href="/attendance/" class="nav-item">📊 Attendance</a>

          <!-- ✅ ADMIN ONLY -->
          {% if request.user.role == "admin" %}
          <a href="/attendance/scan/" class="nav-item">📷 Scan Attendance</a>
          {% endif %}

          <a href="/logout/" class="nav-item logout">🚪 Logout</a>
        </nav>
      </div>

      <!-- Main Section -->

      <div class="main">
        <!-- Navbar -->

        <div class="navbar">
          <button id="menu-toggle">☰</button>

          <span>Welcome, {{ request.user.username }}</span>
        </div>

        <!-- Page Content -->

        <div class="content">{% block content %} {% endblock %}</div>
      </div>
    </div>

    <script>
      const toggleBtn = document.getElementById("menu-toggle");

      const sidebar = document.getElementById("sidebar");

      toggleBtn.onclick = function () {
        sidebar.classList.toggle("collapsed");
      };
    </script>
  </body>
</html>
