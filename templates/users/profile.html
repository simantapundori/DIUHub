{% extends "base.html" %} {% block content %}

<h2 class="page-title">👤 Student Profile</h2>

<div class="card profile-card">
  <form method="post">
    {% csrf_token %}

    <!-- FULL NAME -->
    <div class="form-group">
      <label>Full Name</label>
      <input
        type="text"
        name="full_name"
        value="{{ user.full_name }}"
        class="input-field"
        placeholder="Enter your full name"
      />
    </div>

    <!-- STUDENT ID -->
    <div class="form-group">
      <label>Student ID</label>
      <input
        type="text"
        name="student_id"
        value="{{ user.student_id }}"
        class="input-field"
        placeholder="e.g. 221-15-XXXX"
      />
    </div>

    <!-- EMAIL -->
    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        name="email"
        value="{{ user.email }}"
        class="input-field"
        placeholder="Enter your email"
      />
    </div>

    <!-- CONTACT NUMBER (VALIDATED) -->
    <div class="form-group">
      <label>Contact Number</label>
      <input
        type="text"
        name="contact_number"
        value="{{ user.contact_number }}"
        class="input-field"
        placeholder="01XXXXXXXXX"
        pattern="01[0-9]{9}"
        maxlength="11"
      />
    </div>

    <!-- BLOOD GROUP (INPUT INSTEAD OF DROPDOWN) -->
    <div class="form-group">
      <label>Blood Group</label>
      <input
        type="text"
        name="blood_group"
        value="{{ user.blood_group }}"
        class="input-field"
        placeholder="e.g. A+"
      />
    </div>

    <!-- DEPARTMENT (INPUT INSTEAD OF DROPDOWN) -->
    <div class="form-group">
      <label>Department</label>
      <input
        type="text"
        name="department"
        value="{{ user.department }}"
        class="input-field"
        placeholder="e.g. SWE"
      />
    </div>

    <!-- BATCH -->
    <div class="form-group">
      <label>Batch</label>
      <input
        type="text"
        name="batch"
        value="{{ user.batch }}"
        class="input-field"
        placeholder="e.g. 55"
      />
    </div>

    <!-- SECTION -->
    <div class="form-group">
      <label>Section</label>
      <input
        type="text"
        name="section"
        value="{{ user.section }}"
        class="input-field"
        placeholder="e.g. A"
      />
    </div>

    <!-- BUTTON -->
    <button class="btn-primary">Update Profile</button>
  </form>
</div>

{% endblock %}
