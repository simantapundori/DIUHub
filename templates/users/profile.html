{% extends "base.html" %} {% block content %}

<h2 class="page-title">Student Profile</h2>

<div class="card">
  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label>Full Name</label>
      <input
        type="text"
        name="full_name"
        value="{{ user.full_name }}"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Student ID</label>
      <input
        type="text"
        name="student_id"
        value="{{ user.student_id }}"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        name="email"
        value="{{ user.email }}"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Contact Number</label>
      <input
        type="text"
        name="contact_number"
        value="{{ user.contact_number }}"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Blood Group</label>
      <select name="blood_group" class="form-control">
        <option value="">Select Blood Group</option>

        <option
          value="A+"
          {%
          if
          user.blood_group=""
          ="A+"
          %}selected{%
          endif
          %}
        >
          A+
        </option>
        <option
          value="A-"
          {%
          if
          user.blood_group=""
          ="A-"
          %}selected{%
          endif
          %}
        >
          A-
        </option>
        <option
          value="B+"
          {%
          if
          user.blood_group=""
          ="B+"
          %}selected{%
          endif
          %}
        >
          B+
        </option>
        <option
          value="B-"
          {%
          if
          user.blood_group=""
          ="B-"
          %}selected{%
          endif
          %}
        >
          B-
        </option>
        <option
          value="AB+"
          {%
          if
          user.blood_group=""
          ="AB+"
          %}selected{%
          endif
          %}
        >
          AB+
        </option>
        <option
          value="AB-"
          {%
          if
          user.blood_group=""
          ="AB-"
          %}selected{%
          endif
          %}
        >
          AB-
        </option>
        <option
          value="O+"
          {%
          if
          user.blood_group=""
          ="O+"
          %}selected{%
          endif
          %}
        >
          O+
        </option>
        <option
          value="O-"
          {%
          if
          user.blood_group=""
          ="O-"
          %}selected{%
          endif
          %}
        >
          O-
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Department</label>
      <input
        type="text"
        name="department"
        value="{{ user.department }}"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Batch</label>
      <input
        type="text"
        name="batch"
        value="{{ user.batch }}"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Section</label>
      <input
        type="text"
        name="section"
        value="{{ user.section }}"
        class="form-control"
      />
    </div>

    <button type="submit" class="btn-primary">Update Profile</button>
  </form>
</div>

{% endblock %}
