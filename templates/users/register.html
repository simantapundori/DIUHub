{% load static %}

<!doctype html>
<html>
  <head>
    <title>Register | DIUHub</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body class="auth-page">
    <!-- Toast -->
    {% if messages %}
    <div class="toast-container">
      {% for message in messages %}
      <div class="toast-message">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <div class="auth-container">
      <img src="{% static 'images/diuhub_logo.png' %}" class="auth-logo" />

      <h2>Create Account</h2>

      <form method="POST">
        {% csrf_token %} {% if form.errors %}
        <div class="error-box">{{ form.errors }}</div>
        {% endif %}

        <input
          type="text"
          name="username"
          placeholder="Username"
          class="input-field"
          required
        />
        <input
          type="email"
          name="email"
          placeholder="Email address"
          class="input-field"
          required
        />

        <div class="password-wrapper">
          <input
            type="password"
            name="password1"
            id="pass1"
            placeholder="Password"
            required
          />
          <span class="toggle-eye" onclick="togglePassword('pass1', this)">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>

        <div class="password-wrapper">
          <input
            type="password"
            name="password2"
            id="pass2"
            placeholder="Confirm Password"
            required
          />
          <span class="toggle-eye" onclick="togglePassword('pass2', this)">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>

        <button class="btn-primary">Register</button>
      </form>

      <p class="auth-link">
        Already have an account? <a href="/login/">Login</a>
      </p>
    </div>

    <script>
      function togglePassword(id, el) {
        const input = document.getElementById(id);
        const icon = el.querySelector("i");

        if (input.type === "password") {
          input.type = "text";
          icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.replace("fa-eye-slash", "fa-eye");
        }
      }

      setTimeout(() => {
        document.querySelectorAll(".toast-message").forEach((el) => {
          el.style.opacity = "0";
          setTimeout(() => el.remove(), 500);
        });
      }, 3000);
    </script>
  </body>
</html>
